<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Teachers Day</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F7F4EA',
            forest: '#2D5A4C',
            terracotta: '#D95338',
            mustard: '#E9C46A',
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F7F4EA] text-[#2D5A4C] font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { motion, AnimatePresence } = window.FramerMotion;

    const initialQuotes = [
      {
        quote: "You taught me that not knowing the answer is not a dead end. It is the first, brave step toward finding a better question.",
        author: "With gratitude, from every student",
        noteNo: "01"
      },
      {
        quote: "You made the back row feel like it belonged in the main conversation.",
        author: "Class 3B, many years later",
        noteNo: "02"
      },
      {
        quote: "Thank you for asking 'what do you think?' and actually waiting for the real answer.",
        author: "Someone still thinking",
        noteNo: "03"
      },
      {
        quote: "For making mistakes feel like pencil marks, not permanent ink.",
        author: "A former perfectionist",
        noteNo: "04"
      }
    ];

    function App() {
      const [quoteIndex, setQuoteIndex] = useState(0);
      const [wallNotes, setWallNotes] = useState([
        { text: "For making mistakes feel like pencil marks, not permanent ink.", author: "A FORMER PERFECTIONIST", bg: "bg-white text-forest" },
        { text: "You made the back row feel like it belonged in the conversation.", author: "CLASS 3B, MANY YEARS LATER", bg: "bg-mustard text-forest" },
        { text: "Thank you for asking 'what do you think?' and waiting for the real answer.", author: "SOMEONE STILL THINKING", bg: "bg-forest text-paper" },
        { text: "A teacher's patience becomes a student's inner voice.", author: "WITH A FULL HEART", bg: "bg-terracotta text-white" }
      ]);

      const [nameInput, setNameInput] = useState("");
      const [messageInput, setMessageInput] = useState("");

      const handleNextQuote = () => {
        setQuoteIndex((prev) => (prev + 1) % initialQuotes.length);
      };

      const handleAddNote = (e) => {
        e.preventDefault();
        if (!messageInput.trim()) return;

        const colors = [
          "bg-white text-forest",
          "bg-mustard text-forest",
          "bg-forest text-paper",
          "bg-terracotta text-white"
        ];
        const randomBg = colors[Math.floor(Math.random() * colors.length)];

        setWallNotes([
          {
            text: messageInput,
            author: nameInput.trim() ? nameInput.toUpperCase() : "ANONYMOUS STUDENT",
            bg: randomBg
          },
          ...wallNotes
        ]);

        setMessageInput("");
        setNameInput("");
      };

      return (
        <div class="min-h-screen flex flex-col items-center px-4 py-8 md:py-16 max-w-3xl mx-auto">
          
          <header class="w-full flex justify-between items-center border-b border-forest/10 pb-6 mb-12">
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8 rounded bg-forest text-paper flex items-center justify-center font-serif font-bold text-lg">
                📖
              </div>
              <span class="font-semibold text-lg tracking-tight">The Thank-You Desk</span>
            </div>
            <span class="text-xs uppercase tracking-widest text-forest/60">Special Note</span>
          </header>

          <main class="w-full text-center mb-16">
            <span class="text-xs uppercase tracking-widest text-terracotta font-semibold mb-4 block">
              — A Celebration in Three Small Words —
            </span>
            <h1 class="font-serif text-4xl md:text-6xl font-normal leading-tight mb-6">
              For every teacher who made room for a <span class="italic text-terracotta">question.</span>
            </h1>
            <p class="text-forest/70 max-w-xl mx-auto text-base md:text-lg mb-8">
              Today, we pause the bell, put the pencils down, and remember the people who helped our confidence grow roots.
            </p>
            <a href="#interactive-note" class="inline-flex items-center space-x-2 bg-terracotta text-white px-6 py-3 rounded-xl shadow-lg hover:bg-terracotta/90 transition">
              <span>OPEN A SPECIAL NOTE</span>
              <span>✨</span>
            </a>
          </main>

          <section id="interactive-note" class="w-full mb-24">
            <div class="relative bg-white border border-forest/10 rounded-2xl p-8 md:p-12 shadow-xl overflow-hidden min-h-[280px] flex flex-col justify-between">
              <div class="flex justify-between items-center text-xs tracking-widest text-forest/40 uppercase mb-6">
                <span>Teacher's Day · 2026</span>
                <span>Note No. {initialQuotes[quoteIndex].noteNo}</span>
              </div>

              <AnimatePresence mode="wait">
                <motion.div
                  key={quoteIndex}
                  initial={{ opacity: 0, y: 15 }}
                  animate={{ opacity: 1, y: 0 }}
                  exit={{ opacity: 0, y: -15 }}
                  transition={{ duration: 0.3 }}
                >
                  <blockquote class="font-serif text-2xl md:text-3xl text-forest leading-snug mb-6">
                    "{initialQuotes[quoteIndex].quote}"
                  </blockquote>
                  <p class="italic text-terracotta font-serif">
                    {initialQuotes[quoteIndex].author}
                  </p>
                </motion.div>
              </AnimatePresence>

              <div class="mt-8 pt-6 border-t border-forest/5 flex justify-end">
                <button
                  onClick={handleNextQuote}
                  class="flex items-center space-x-2 text-xs uppercase tracking-wider font-semibold border border-forest/20 rounded-lg px-4 py-2 hover:bg-forest hover:text-paper transition"
                >
                  <span>🔄 Another Note</span>
                </button>
              </div>
            </div>
          </section>

          <section class="w-full bg-forest text-paper rounded-3xl p-8 md:p-12 mb-24 shadow-2xl">
            <span class="text-xs uppercase tracking-widest text-mustard font-semibold mb-2 block">
              02 / Your Turn
            </span>
            <h2 class="font-serif text-3xl md:text-5xl mb-4">Put one true thing on the desk.</h2>
            <p class="text-paper/70 mb-8 max-w-md">
              Think of the teacher who remembered your name, made room after class, or helped you see around the corner. Leave them a note below.
            </p>

            <form onSubmit={handleAddNote} class="space-y-4">
              <input
                type="text"
                placeholder="Your name (optional)"
                value={nameInput}
                onChange={(e) => setNameInput(e.target.value)}
                class="w-full bg-paper/10 border border-paper/20 rounded-xl px-4 py-3 text-paper placeholder-paper/40 focus:outline-none focus:border-mustard"
              />
              <textarea
                rows="3"
                placeholder="I remember when..."
                value={messageInput}
                onChange={(e) => setMessageInput(e.target.value)}
                class="w-full bg-paper/10 border border-paper/20 rounded-xl px-4 py-3 text-paper placeholder-paper/40 focus:outline-none focus:border-mustard"
                required
              ></textarea>
              <button
                type="submit"
                class="bg-terracotta text-white font-semibold text-xs tracking-widest uppercase px-6 py-4 rounded-xl hover:bg-terracotta/90 transition shadow-md"
              >
                📌 Pin Note
              </button>
            </form>
          </section>

          <section class="w-full mb-16">
            <span class="text-xs uppercase tracking-widest text-terracotta font-semibold mb-2 block">
              03 / The Note Wall
            </span>
            <h2 class="font-serif text-3xl md:text-4xl mb-2">The small things become the big things.</h2>
            <p class="text-forest/60 mb-8">A handful of anonymous thank-yous, collected from the desks and doorways of memory.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              {wallNotes.map((note, idx) => (
                <motion.div
                  key={idx}
                  layout
                  initial={{ opacity: 0, scale: 0.95 }}
                  animate={{ opacity: 1, scale: 1 }}
                  class={`p-6 rounded-2xl shadow-md flex flex-col justify-between border border-black/5 ${note.bg}`}
                >
                  <p class="font-serif text-lg leading-snug mb-6">"{note.text}"</p>
                  <span class="text-[10px] tracking-widest uppercase opacity-60 font-semibold">— {note.author}</span>
                </motion.div>
              ))}
            </div>
          </section>

          <footer class="text-center border-t border-forest/10 pt-12 w-full text-xs text-forest/50 space-y-2">
            <p>An Open Note By All Students.</p>
            <p>Made with ❤️ for teachers everywhere</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
